<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="samples.js"></script>
<style>html,body{margin:0;background:var(--bg)}body{padding:20px}</style></head><body><div id="root"></div>
<script type="text/babel">
const {CodeBlock,Tabs,Tag}=window.KerasiDesignSystem_6c0512;
const S=window.KERASI_CODE_SAMPLES;
const LANGS=[['ts','TS'],['py','Python'],['rs','Rust'],['go','Go'],['sql','SQL'],['sh','Shell'],['css','CSS'],['html','HTML'],['json','JSON'],['yaml','YAML'],['diff','Diff']];
const THEMES=['sakura','sakura-dark','wine','wine-dark','rust','rust-dark'];
function App(){const [l,setL]=React.useState('ts');const [t,setT]=React.useState('sakura');
  React.useEffect(()=>{document.documentElement.setAttribute('data-theme',t);},[t]);
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{THEMES.map(x=><Tag key={x} selected={x===t} onClick={()=>setT(x)}>{x}</Tag>)}</div>
    <Tabs items={LANGS.map(([id,label])=>({id,label}))} value={l} onChange={setL}/>
    <CodeBlock language={l} title={S[l][0]} code={S[l][1]} highlightLines={l==='ts'?[11]:[]} maxHeight={360}/>
  </div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
