<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div><div style="background:var(--bg-sunken);padding:16px"><div style="display:flex;gap:14px;align-items:flex-end"><img src="../assets/favicon/kerasi-favicon.svg" width="96"><img src="../assets/favicon/kerasi-favicon.svg" width="48"><img src="../assets/favicon/kerasi-favicon.svg" width="32"><img src="../assets/favicon/kerasi-favicon.svg" width="16"></div></div><div class="m" style="margin-top:6px">Paper tile · default</div></div><div><div style="background:var(--bg-sunken);padding:16px"><div style="display:flex;gap:14px;align-items:flex-end"><img src="../assets/favicon/kerasi-favicon-dark.svg" width="96"><img src="../assets/favicon/kerasi-favicon-dark.svg" width="48"><img src="../assets/favicon/kerasi-favicon-dark.svg" width="32"><img src="../assets/favicon/kerasi-favicon-dark.svg" width="16"></div></div><div class="m" style="margin-top:6px">Dark tile</div></div><div><div style="background:#fff;padding:16px"><div style="display:flex;gap:14px;align-items:flex-end"><img src="../assets/favicon/kerasi-favicon-bare.svg" width="96"><img src="../assets/favicon/kerasi-favicon-bare.svg" width="48"><img src="../assets/favicon/kerasi-favicon-bare.svg" width="32"><img src="../assets/favicon/kerasi-favicon-bare.svg" width="16"></div></div><div class="m" style="margin-top:6px">Bare · light UI only</div></div></div><p style="font-size:13px;color:var(--fg-2);margin:16px 0 0">Same silhouette as the main mark, redrawn on a 32px grid with edges snapped to whole and half pixels so it stays crisp. The second lantern and minor facets are dropped; the trunk is widened to stay visible at 16px.</p></body></html>
