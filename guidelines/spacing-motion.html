<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Short, decisive easing. No bounce." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;height:150px;overflow:hidden}.m{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:.04em}</style></head><body><style>@keyframes slide{0%,15%{transform:translateX(0)}55%,100%{transform:translateX(520px)}}</style><div style="display:grid;gap:12px"><div><div class="m">--ease-out · 220ms</div><div style="height:2px;background:var(--line);position:relative;margin-top:8px"><div style="position:absolute;top:-7px;width:16px;height:16px;background:var(--accent);animation:slide 2.4s var(--ease-out) infinite alternate"></div></div></div><div><div class="m">--ease-in-out · 420ms</div><div style="height:2px;background:var(--line);position:relative;margin-top:8px"><div style="position:absolute;top:-7px;width:16px;height:16px;background:var(--accent);animation:slide 2.4s var(--ease-in-out) infinite alternate"></div></div></div></div></body></html>
