<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;height:300px;overflow:hidden}.m{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:.04em}</style></head><body><div style="display:flex;gap:40px;align-items:center"><div style="position:relative;width:250px;height:250px"><img src="../assets/logo/kerasi-mark.svg" width="250" height="250"><div style="position:absolute;inset:5px;border:1px dashed var(--accent);border-radius:50%"></div><div style="position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--line-strong)"></div><div style="position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--line-strong)"></div></div><div style="max-width:320px;font-size:14px;color:var(--fg-2)"><p style="margin:0 0 8px">The old badge border is gone. The circle is still there, just unseen — the mark reads as a coin at a distance and as open landscape up close.</p><p style="margin:0">Clear space: ¼ of the mark's width on all sides. Minimum size 24px.</p></div></div></body></html>
