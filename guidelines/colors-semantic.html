<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;height:250px;overflow:hidden}.m{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:.04em}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px 10px"><div><div style="height:34px;background:var(--bg);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--bg</div></div><div><div style="height:34px;background:var(--bg-raised);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--bg-raised</div></div><div><div style="height:34px;background:var(--bg-sunken);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--bg-sunken</div></div><div><div style="height:34px;background:var(--fg-1);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--fg-1</div></div><div><div style="height:34px;background:var(--fg-2);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--fg-2</div></div><div><div style="height:34px;background:var(--fg-3);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--fg-3</div></div><div><div style="height:34px;background:var(--line);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--line</div></div><div><div style="height:34px;background:var(--line-strong);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--line-strong</div></div><div><div style="height:34px;background:var(--accent);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--accent</div></div><div><div style="height:34px;background:var(--accent-hover);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--accent-hover</div></div><div><div style="height:34px;background:var(--accent-soft);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--accent-soft</div></div><div><div style="height:34px;background:var(--accent-ink);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--accent-ink</div></div><div><div style="height:34px;background:var(--accent-2);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--accent-2</div></div><div><div style="height:34px;background:var(--accent-3);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--accent-3</div></div><div><div style="height:34px;background:var(--highlight);border:1px solid var(--line)"></div><div class="m" style="margin-top:4px;color:var(--fg-2)">--highlight</div></div></div></body></html>
