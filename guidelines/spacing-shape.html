<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;height:170px;overflow:hidden}.m{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:.04em}</style></head><body><div style="display:flex;gap:24px;align-items:center"><div style="text-align:center"><div style="width:90px;height:90px;border:1.5px solid var(--fg-1);border-radius:0"></div><div class="m" style="margin-top:6px">--radius-0</div></div><div style="text-align:center"><div style="width:90px;height:90px;border:1.5px solid var(--fg-1);border-radius:2px"></div><div class="m" style="margin-top:6px">--radius-1</div></div><div style="text-align:center"><div style="width:90px;height:90px;background:var(--accent);clip-path:var(--clip-chamfer)"></div><div class="m" style="margin-top:6px">--clip-chamfer</div></div><div style="text-align:center"><div style="width:90px;height:90px;background:var(--accent-2);--chamfer:var(--chamfer-lg);clip-path:var(--clip-chamfer)"></div><div class="m" style="margin-top:6px">chamfer-lg</div></div><div style="text-align:center"><div style="width:90px;height:90px;border-radius:50%;background:var(--accent-3)"></div><div class="m" style="margin-top:6px">circle (sun)</div></div></div></body></html>
